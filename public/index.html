<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天网页</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-top">
        <h1 class="room-title">聊天网页</h1>
        <div class="conn" id="conn"><i class="dot"></i><span id="connText">连接中…</span></div>
      </div>

      <div class="me">
        <button type="button" class="avatar avatar-lg avatar-pick" id="meAvatar"
          title="点击更换头像颜色" aria-label="更换头像颜色">·</button>
        <div class="me-info">
          <div class="me-name" id="meName">…</div>
          <button class="link-btn" id="nickBtn" type="button">点击改名</button>
        </div>
      </div>

      <div class="side-label">在线成员 <span id="userCount">0</span></div>
      <ul class="users" id="userList"></ul>
    </aside>

    <main class="chat">
      <div class="messages" id="messages"></div>

      <div class="more-wrap" id="moreWrap" hidden>
        <button type="button" class="more-btn" id="moreBtn">加载更早的消息</button>
      </div>

      <div class="typing" id="typing"></div>

      <div class="composer">
        <div class="quote-bar" id="quoteBar" hidden>
          <div class="quote-info">
            <div class="quote-label" id="quoteLabel">引用</div>
            <div class="quote-text" id="quoteText"></div>
          </div>
          <button type="button" class="quote-close" id="quoteClose" aria-label="取消引用">×</button>
        </div>

        <div class="input-row">
          <button type="button" class="icon-btn" id="emojiBtn" title="表情">☺</button>
          <textarea id="input" rows="1" maxlength="1000"
            placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button type="button" class="send-btn" id="sendBtn">发送</button>
        </div>

        <div class="emoji-panel" id="emojiPanel" hidden></div>
      </div>
    </main>
  </div>

  <!-- 房间口令弹窗：用页面内实现，不用 window.prompt -->
  <div class="modal-mask" id="keyModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="keyModalTitle">
      <h2 class="modal-title" id="keyModalTitle">这个房间需要口令</h2>
      <p class="modal-desc" id="keyModalDesc">请输入房间口令后进入。</p>
      <input class="modal-input" id="keyInput" type="text" inputmode="text"
        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
        placeholder="粘贴或输入口令">
      <div class="modal-meta">
        <span id="keyLen">0 位</span>
        <button type="button" class="modal-paste" id="keyPaste">粘贴</button>
      </div>
      <p class="modal-err" id="keyErr" hidden></p>
      <div class="modal-actions">
        <button type="button" class="modal-btn" id="keyCancel">取消</button>
        <button type="button" class="modal-btn primary" id="keyOk">进入房间</button>
      </div>
    </div>
  </div>

  <!-- 换头像：可以从相册选图，也可以挑颜色；改之前都会再问一次「是否确定修改」 -->
  <div class="modal-mask" id="avatarModal" hidden>
    <div class="modal modal-avatar" role="dialog" aria-modal="true" aria-labelledby="avatarModalTitle">
      <h2 class="modal-title" id="avatarModalTitle">修改头像</h2>
      <p class="modal-desc">从相册选一张，或挑一个颜色。改之前会再问你一次。</p>

      <!-- 从相册选图 -->
      <label class="avatar-upload" for="avatarFile">
        <input type="file" id="avatarFile" accept="image/*" hidden>
        <span class="avatar-upload-preview" id="avatarUploadPreview">＋</span>
        <span class="avatar-upload-text">
          <b>从相册选择图片</b>
          <i>会自动裁成方形并压缩</i>
        </span>
      </label>

      <div class="modal-sep"><span>或者挑一个颜色</span></div>

      <div class="color-grid" id="colorGrid"></div>
      <div class="modal-actions">
        <button type="button" class="modal-btn" id="avatarCancel">取消</button>
      </div>
    </div>
  </div>

  <!-- 确认框：是否确定修改 -->
  <div class="modal-mask" id="avatarConfirm" hidden>
    <div class="modal modal-avatar" role="dialog" aria-modal="true" aria-labelledby="avatarConfirmTitle">
      <h2 class="modal-title" id="avatarConfirmTitle">是否确定修改？</h2>
      <p class="modal-desc">改成这个头像：</p>
      <div class="avatar-preview">
        <div class="avatar avatar-xl" id="avatarPreview">·</div>
        <div class="avatar-preview-name" id="avatarPreviewName">…</div>
      </div>
      <p class="modal-err" id="avatarErr" hidden></p>
      <div class="modal-actions">
        <button type="button" class="modal-btn" id="avatarConfirmCancel">再想想</button>
        <button type="button" class="modal-btn primary" id="avatarConfirmOk">确定修改</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
