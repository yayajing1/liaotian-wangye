<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天网页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #d7eaf8;                 /* 与聊天室一致的浅蓝 */
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      cursor: pointer;
      overflow: hidden;
    }

    .stage {
      text-align: center;
      animation: fade .45s ease both;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    .title {
      font-family: "STXingkai", "华文行楷", "STKaiti", "KaiTi", cursive;
      font-weight: 400;                     /* 行楷无粗体字重 */
      font-size: clamp(46px, 9vw, 88px);
      letter-spacing: 6px;
      color: #45a0d4;                      /* 浅蓝，底色也是浅蓝所以加深一档保证对比 */
      text-shadow: 0 2px 10px rgba(255, 255, 255, .6);
    }

    .sub {
      margin-top: 10px;
      font-size: 13px;
      color: #5c7f96;
      letter-spacing: 2px;
    }

    .enter {
      margin-top: 30px;
      display: inline-block;
      padding: 9px 30px;
      border-radius: 22px;
      background: #ffffff;
      border: 1px solid #b9d7ec;
      color: #3d7ea6;
      font-size: 13.5px;
      letter-spacing: 1px;
      box-shadow: 0 3px 12px rgba(60, 120, 160, .12);
    }

    .dots {
      margin-top: 18px;
      font-size: 12px;
      color: #7b96ab;
      letter-spacing: 1px;
    }

    .dots i {
      display: inline-block;
      width: 5px; height: 5px;
      margin: 0 3px;
      border-radius: 50%;
      background: #7b96ab;
      animation: blink 1.2s infinite;
    }
    .dots i:nth-child(2) { animation-delay: .2s; }
    .dots i:nth-child(3) { animation-delay: .4s; }

    @keyframes blink {
      0%, 60%, 100% { opacity: .25; }
      30%           { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="title">聊天网页</div>
    <div class="sub">多人聊天室</div>
    <div class="enter">点击进入聊天室</div>
    <div class="dots"><span id="tip">5 秒后自动进入</span></div>
  </div>

  <script>
    (function () {
      var TARGET = '/chat';
      var LEFT = 5;
      var gone = false;
      var tip = document.getElementById('tip');

      function go() {
        if (gone) return;
        gone = true;
        window.location.href = TARGET;
      }

      // 点页面任意处立即进入
      document.addEventListener('click', go);
      document.addEventListener('keydown', go);

      // 倒计时 5 秒后自动进入
      var timer = setInterval(function () {
        LEFT -= 1;
        if (LEFT <= 0) { clearInterval(timer); go(); return; }
        tip.textContent = LEFT + ' 秒后自动进入';
      }, 1000);
    })();
  </script>
</body>
</html>
